# Deploy Pipeline Configuration Example
# Copy this file to your project's .diatom directory as deploy.yaml and customize it.
#
# Usage:
#   1. Place deploy.yaml in your project's .diatom directory
#   2. Open the project in Diatom IDE
#   3. Click [▶ Deploy] button in the terminal toolbar
#
# Variable substitution:
#   {{VARIABLE_NAME}} is replaced with values from the "variables" section
#   Built-in variables: PROJECT_NAME, PROJECT_DIR, WORKSPACE_DIR, timestamp
#
# Supported action types:
#   run_command  - Execute shell command locally
#   maven        - Execute Maven goals locally
#   gradle       - Execute Gradle tasks locally
#   docker       - Execute Docker commands locally
#   ssh_command  - Execute command on remote host via SSH (requires JSch)
#   scp          - Upload files to remote host via SFTP/SCP
#   git          - Git operations (clone, checkout, pull, push, commit, tag, branch, status)
#   svn          - SVN operations (checkout, update, commit, export, status)
#   jenkins      - Trigger Jenkins jobs via HTTP API
#   k8s          - Kubernetes operations via kubectl CLI
#
# SSH authentication:
#   - RECOMMENDED: use key: /path/to/private_key
#   - ALTERNATIVE: use password: "plain" (auto-encrypted to $ENC$... on save)
#   - OPTIONAL: omit both key and password to be prompted interactively
#     during deployment (CLI uses masked console input).
#
# Host key verification (STRICT_HOST_KEY_CHECK):
#   Defaults to "ask" — first-time SSH connections prompt for confirmation
#   (console in CLI, pluggable provider in IDE). Set to "no" to skip,
#   or "yes" for strict verification.
#
# Host resolution rules:
#   - Single-host mode: define hosts under top-level "servers". Remote steps (ssh_command/scp)
#     may omit host/cluster and will automatically target the single server.
#   - Cluster mode: define hosts under clusters.<name>.hosts. Remote steps MUST include
#     cluster: "<name>".
#
# Profiles (multi-environment):
#   Add a "profiles" section with environment-specific variable overrides.
#   Profile variables OVERRIDE top-level variables of the same name.
#   Profiles do NOT change steps/servers/clusters structure.
#   CLI: 'deploy' uses "default" profile if it exists, otherwise uses top-level variables only.
#   CLI: 'deploy dev' uses the "dev" profile.
#   IDE: Profile selector dropdown appears next to the Deploy button.

