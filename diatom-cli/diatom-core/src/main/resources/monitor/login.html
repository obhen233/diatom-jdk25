<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diatom Gateway Monitor - Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 48px 40px;
    width: 400px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
}
.logo {
    text-align: center;
    margin-bottom: 32px;
}
.logo h1 {
    color: #e2e8f0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
}
.logo span {
    color: #60a5fa;
    font-weight: 700;
}
.logo p {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 8px;
}
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
}
.form-group input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 15px;
    transition: border-color 0.2s;
    outline: none;
}
.form-group input:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
}
.form-group input::placeholder {
    color: #64748b;
}
.btn-login {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}
.btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(59,130,246,0.35);
}
.btn-login:active {
    transform: translateY(0);
}
.btn-login:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}
.error-msg {
    color: #f87171;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
    text-align: center;
    padding: 8px;
    background: rgba(248,113,113,0.1);
    border-radius: 6px;
}
.loading {
    display: none;
    text-align: center;
    margin-bottom: 16px;
}
.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <h1><span>Diatom</span> <span data-i18n="login.title">Gateway Monitor</span></h1>
        <p data-i18n="login.subtitle">Please sign in to access the dashboard</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="loading" id="loading"><div class="spinner"></div></div>
    <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
            <label for="username" data-i18n="login.username">Username</label>
            <input type="text" id="username" data-i18n-placeholder="login.enter_username" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password" data-i18n="login.password">Password</label>
            <input type="password" id="password" data-i18n-placeholder="login.enter_password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login" id="loginBtn" data-i18n="login.sign_in">Sign In</button>
    </form>
</div>
<script>
// ========== i18n ==========
window.__ = {};
function t(key) { return window.__[key] || key; }
function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
        el.innerHTML = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
    });
}
function fetchTranslations(lang) {
    var url = '/monitor/api/i18n';
    if (lang) url += '?lang=' + encodeURIComponent(lang);
    return fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        window.__ = data || {};
        applyTranslations();
    }).catch(function(err) { console.error('Failed to load translations:', err); });
}
(function() {
    var lang = localStorage.getItem('diatom_monitor_lang');
    if (lang) fetchTranslations(lang);
})();

function doLogin(e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    var errorEl = document.getElementById('errorMsg');
    var loadingEl = document.getElementById('loading');
    var btn = document.getElementById('loginBtn');

    errorEl.style.display = 'none';
    loadingEl.style.display = 'block';
    btn.disabled = true;

    fetch('/monitor/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(function(r) { return r.json().then(function(d) { return { status: r.status, data: d }; }); })
    .then(function(resp) {
        loadingEl.style.display = 'none';
        btn.disabled = false;
        if (resp.status === 200 && resp.data.token) {
            localStorage.setItem('diatom_monitor_token', resp.data.token);
            window.location.href = '/monitor/';
        } else {
            errorEl.textContent = resp.data.error || t('login.failed');
            errorEl.style.display = 'block';
        }
    })
    .catch(function(err) {
        loadingEl.style.display = 'none';
        btn.disabled = false;
        errorEl.textContent = t('login.connection_error') + ': ' + err.message;
        errorEl.style.display = 'block';
    });

    return false;
}

// If already logged in, redirect to dashboard
if (localStorage.getItem('diatom_monitor_token')) {
    window.location.href = '/monitor/';
}
</script>
</body>
</html>
