# Worker 能力自述文档示例
# 复制到 {workspaceDir}/.diatom/capability.md 或通过 --description 自动生成。
#
# 使用方式：
#   1. 编写 capability.md 描述该 Worker 擅长的工作
#   2. 放到 {workspaceDir}/.diatom/capability.md
#   3. Gateway 读取此文件以将任务路由到最合适的 Worker
#
# 或者在启动 Worker 时使用：
#   --description "我擅长……"  (AI 自动生成 capability.md)
#   --capability /path/to/capability.md  (使用自定义文件)

# ============================================================
# 示例 1：全栈 Web 开发 Worker
# ============================================================
# # Worker 能力自述
#
# ## 基本信息
# - **Worker ID**: worker-web-001
# - **模型**: claude-sonnet-4-6
# - **等级**: standard
# - **支持工具调用**: 是
# - **支持流式输出**: 是
# - **API 提供商**: anthropic
#
# ## 擅长领域
# - 全栈 Web 开发（React, Spring Boot, PostgreSQL）
# - RESTful 与 GraphQL API 设计与实现
# - 数据库 schema 设计与性能优化
# - 前端 UI 开发与响应式设计
# - CI/CD 流水线配置与自动化
#
# ## 能力边界
# - 无互联网访问能力（不能调用外部 API）
# - 文件操作仅限于工作区目录
# - 部署到生产环境需要用户确认
# - 无权访问系统凭据或密钥
#
# ## 适合处理的任务类型
# - [x] feature_development (required)
# - [x] bug_fix (preferred)
# - [x] code_review
# - [x] refactoring
# - [x] database_migration (preferred)
# - [ ] web_scraping（不支持）
# - [ ] image_analysis（不支持）
#
# ## 复杂任务处理能力
# - 可处理复杂任务: 是
# - 建议最大步骤数: 50
# - 单任务建议 Token 预算: 128000
# - 最大输出 Token: 16384

