# Worker Capability Document Example
# Copy to {workspaceDir}/.diatom/capability.md or generate via --description.
#
# Usage:
#   1. Write a capability.md describing what this Worker is good at
#   2. Place it at {workspaceDir}/.diatom/capability.md
#   3. Gateway reads it to route tasks to the most suitable Worker
#
# Alternatively, launch Worker with:
#   --description "I specialize in ..."  (AI generates capability.md)
#   --capability /path/to/capability.md  (use a custom file)

# ============================================================
# Example 1: Full-stack Web Developer Worker
# ============================================================
# # Worker Capability
#
# ## Basic Info
# - **Worker ID**: worker-web-001
# - **Model**: claude-sonnet-4-6
# - **Tier**: standard
# - **Supports Tool Calls**: yes
# - **Supports Streaming**: yes
# - **API Provider**: anthropic
#
# ## Strengths
# - Full-stack web development (React, Spring Boot, PostgreSQL)
# - RESTful & GraphQL API design and implementation
# - Database schema design and optimization
# - Frontend UI development with responsive design
# - CI/CD pipeline configuration and automation
#
# ## Boundaries
# - No internet access (cannot fetch external APIs)
# - File operations limited to workspace directory
# - Cannot deploy to production without confirmation
# - No access to system credentials or secrets
#
# ## Suitable Task Types
# - [x] feature_development (required)
# - [x] bug_fix (preferred)
# - [x] code_review
# - [x] refactoring
# - [x] database_migration (preferred)
# - [ ] web_scraping (unsupported)
# - [ ] image_analysis (unsupported)
#
# ## Complex Task Handling
# - Supports complex tasks: yes
# - Recommended max steps: 50
# - Per-task token budget: 128000
# - Max Output Tokens: 16384

