cli.config.help=Config Commands:\n  config              List all configs\n  config list         List all configs\n  config list <cat>   List configs by category\n  config get <key>    Get config value\n  config set <key> <value>  Set config value\n  config reset <key>  Reset to default

# Rules command
cli.rules.description=Manage command rules
cli.rules.help=Rules Commands:\n  rules list [filter]   List rules (filter: terminal, agent, allowed, blocked, dangerous)\n  rules add <mode> <type> <pattern>  Add rule (mode: terminal/agent, type: allowed/blocked/dangerous)\n  rules remove <mode> <type> <pattern>  Remove rule\n  rules enable <id>        Enable rule\n  rules disable <id>       Disable rule\n  rules clear <source>    Clear rules (source: auto-learned, manual)\n  rules reset              Reset to built-in rules

