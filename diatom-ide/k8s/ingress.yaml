# diatom-ide Ingress
# 将 HTTP 流量路由到 diatom-ide Service。按实际集群替换 host 与 ingressClassName。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diatom-ide
  namespace: default
  annotations:
    # WebSocket（LSP / terminal-ws）需要长连接，禁用缓冲与超时裁剪
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    - host: diatom-ide.example.com   # TODO: 替换为实际域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: diatom-ide
                port:
                  name: http
