#Diatom CLI Config
#Tue Apr 21 19:31:28 CST 2026
api.key=
api.base.url=
model=
workspace.dir=
agent.max_steps=10
# 是否允许访问工作区外的资源 (true=允许访问任意路径, false=需要授权或仅限工作区)
filesystem.allow_external=false

# === 命令沙箱配置 ===
# 沙箱模式: whitelist=白名单模式, none=无限制 (生产环境建议用 whitelist)
command.sandbox.mode=whitelist
# 允许执行的命令列表 (逗号分隔)
command.whitelist=mvn,git,npm,node,java,javac,go,python,python3,gradle,ant,make,cmake,\
find,grep,egrep,fgrep,findstr,rg,ack,ag,\
cat,type,tac,less,more,head,tail,nl,wc,\
ls,dir,tree,ll,la,pwd,whoami,hostname,uname,date,time,uptime,env,id,echo,printenv,\
curl,wget,zip,unzip,tar,gzip,gunzip,rsync,scp,ssh,\
cmd,copy,move,del,rd,mkdir,rmdir,replace,attrib,compact,\
tasklist,taskkill,sc,net,netuse,net share,ipconfig,ping,tracert,nslookup,hostname,\
systeminfo,ver,vol,label,chkdsk,sfc,dism,diskpart,bcdedit,reg,runas
# 命令最大执行时间(秒)
command.timeout=60
# 命令输出最大字节数
command.max_output_bytes=1048576

app.language=zh
