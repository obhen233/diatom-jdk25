server.port=8080

# \u542F\u7528\u865A\u62DF\u7EBF\u7A0B\uFF08Spring Boot 3.2+\uFF0CJDK 21+\uFF09
spring.threads.virtual.enabled=true

# \u5DE5\u4F5C\u533A\u8DEF\u5F84\uFF0C\u4F18\u5148\u7EA7\uFF1A\u73AF\u5883\u53D8\u91CF WORKSPACE_PATH > \u914D\u7F6E\u503C > ${user.dir}/workspace
# \u672C\u5730\u9ED8\u8BA4 D:/temp\uFF1B\u5BB9\u5668/\u4E91\u4E0A\u53EF\u901A\u8FC7 WORKSPACE_PATH \u73AF\u5883\u53D8\u91CF\u8986\u76D6\u4E3A Linux \u8DEF\u5F84
workspace.path=${WORKSPACE_PATH:D:/temp}
# \u6587\u4EF6\u4E0A\u4F20\u914D\u7F6E
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Console encoding
spring.output.ansi.enabled=always
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==================== IDE \u9ED8\u8BA4\u914D\u7F6E ====================
# \u4E3B\u9898: dark / light
ide.theme=dark
# \u8BED\u8A00: en / zh (\u7559\u7A7A\u81EA\u52A8\u68C0\u6D4B\u7CFB\u7EDF\u8BED\u8A00)
ide.language=
# \u7F16\u8BD1\u8F93\u51FA\u5B57\u8282\u7801\u7684 JDK \u7248\u672C (5-25)
ide.jdk.version=25
# JAVA_HOME\uFF0C\u7559\u7A7A\u5219\u4F7F\u7528 IDE \u81EA\u8EAB\u7684 java.home\uFF0C\u518D\u6CA1\u6709\u5219\u4ECE\u7CFB\u7EDF\u73AF\u5883\u53D8\u91CF\u53D6
ide.java.home=
# MAVEN_HOME\uFF0C\u7559\u7A7A\u5219\u4ECE\u7CFB\u7EDF\u73AF\u5883\u53D8\u91CF M2_HOME / MAVEN_HOME \u53D6
ide.maven.home=
# Maven user settings.xml \u8DEF\u5F84
ide.maven.user.settings=
# Maven \u672C\u5730\u4ED3\u5E93\u8DEF\u5F84
ide.maven.local.repository=
# Gradle user home \u8DEF\u5F84
ide.gradle.user.home=
# Git \u53EF\u6267\u884C\u6587\u4EF6\u8DEF\u5F84\uFF08\u7559\u7A7A\u81EA\u52A8\u4ECE PATH \u67E5\u627E\uFF09
ide.git.path=
# SVN \u53EF\u6267\u884C\u6587\u4EF6\u8DEF\u5F84\uFF08\u7559\u7A7A\u81EA\u52A8\u4ECE PATH \u67E5\u627E\uFF09
ide.svn.path=

# ==================== Actuator / \u6307\u6807 ====================
# \u5065\u5EB7\u68C0\u67E5\u3001\u6307\u6807\u3001Prometheus \u66B4\u9732
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# \u672A\u6388\u6743\u65F6\u4E0D\u5C55\u793A\u8BE6\u7EC6\u5065\u5EB7\u4FE1\u606F
management.endpoint.health.show-details=never
# \u542F\u7528 liveness / readiness \u63A2\u9488
management.endpoint.health.probes.enabled=true
# \u4F7F\u7528\u865A\u62DF\u7EBF\u7A0B\u5B66\u751F\u6210\u6307\u6807\u4E5F\u65E0\u5F00\u9500\uFF0C\u9ED8\u8BA4\u4E0D\u542F\u7528\u6307\u6807\u65E5\u5FD7

# ==================== \u4F1A\u8BDD\u914D\u7F6E ====================
# \u4F1A\u8BDD\u65E0\u64CD\u4F5C\u8D85\u65F6\u65F6\u95F4\uFF08\u5C0F\u65F6\uFF09\uFF0C\u9ED8\u8BA4 4 \u5C0F\u65F6\uFF0C\u652F\u6301\u5C0F\u6570\u5982 0.5 \u8868\u793A 30 \u5206\u949F
ide.session.timeout-hours=4

# ==================== Docker \u8BA4\u8BC1\u914D\u7F6E ====================
# Docker \u73AF\u5883\u8BA4\u8BC1\u6A21\u5F0F\uFF1Aauto\uFF08\u81EA\u52A8\u68C0\u6D4B\uFF09\u3001true\uFF08\u5F3A\u5236\u542F\u7528\uFF09\u3001false\uFF08\u5F3A\u5236\u7981\u7528\uFF09\uFF0C\u9ED8\u8BA4 auto
# \u53EF\u901A\u8FC7\u73AF\u5883\u53D8\u91CF IDE_DOCKER_ENABLED \u8986\u76D6
ide.docker.enabled=${IDE_DOCKER_ENABLED:auto}
# Docker \u767B\u5F55\u7528\u6237\u540D\uFF08\u9ED8\u8BA4 appuser\uFF09
ide.docker.username=${IDE_DOCKER_USERNAME:appuser}
# Docker \u767B\u5F55\u5BC6\u7801\uFF08\u5EFA\u8BAE\u4F7F\u7528 password-hash \u4EE3\u66FF\u660E\u6587\u5BC6\u7801\uFF09
# \u53EF\u901A\u8FC7\u73AF\u5883\u53D8\u91CF IDE_DOCKER_PASSWORD \u8986\u76D6
ide.docker.password=${IDE_DOCKER_PASSWORD:}
# Docker \u767B\u5F55\u5BC6\u7801\u7684 SHA-256 \u54C8\u5E0C\uFF08Base64 \u7F16\u7801\uFF09\uFF0C\u4F18\u5148\u4E8E\u660E\u6587\u5BC6\u7801
# \u751F\u6210\u65B9\u5F0F\uFF1Aecho -n "your_password" | sha256sum | cut -d' ' -f1 | xxd -r -p | base64
# \u53EF\u901A\u8FC7\u73AF\u5883\u53D8\u91CF IDE_DOCKER_PASSWORD_HASH \u8986\u76D6
ide.docker.password-hash=${IDE_DOCKER_PASSWORD_HASH:}

# ==================== AI \u914D\u7F6E ====================
# \u5927\u6A21\u578B API \u5730\u5740\uFF08OpenAI \u517C\u5BB9\u683C\u5F0F\uFF09\uFF0C\u5982 https://api.openai.com/v1/chat/completions
ide.ai.api-url=
# API Token / Key
ide.ai.api-token=
# \u6A21\u578B\u540D\u79F0\uFF0C\u5982 gpt-3.5-turbo, gpt-4, deepseek-chat \u7B49
ide.ai.model=
# \u662F\u5426\u542F\u7528 AI \u529F\u80FD\uFF08true/false\uFF09
ide.ai.enabled=true

# ==================== diatom-springboot-starter \u914D\u7F6E ====================
# \u542F\u7528 IDE \u6A21\u5F0F\uFF0C\u8BA9 AI \u914D\u7F6E\u4ECE IDE \u7684 SQLite \u8BBE\u7F6E\u4E2D\u8BFB\u53D6
diatom.ide.enabled=true
# \u8BED\u8A00
diatom.app.language=zh

# ==================== SQLite \u6570\u636E\u6E90 ====================
spring.datasource.url=jdbc:sqlite:ide_settings.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==================== i18n \u56FD\u9645\u5316\u914D\u7F6E ====================
# \u6D88\u606F\u8D44\u6E90\u6587\u4EF6\u57FA\u7840\u540D\uFF08\u5BF9\u5E94 messages.properties \u548C messages_zh.properties\uFF09
spring.messages.basename=messages
# \u6D88\u606F\u7F16\u7801
spring.messages.encoding=UTF-8
# \u7F13\u5B58\u6D88\u606F\u7684\u65F6\u957F\uFF08\u79D2\uFF09\uFF0C3600 = 1\u5C0F\u65F6
spring.messages.cache-duration=3600
# \u662F\u5426\u59CB\u7EC8\u4F7F\u7528\u6D88\u606F\u4EE3\u7801\u4F5C\u4E3A\u9ED8\u8BA4\u6D88\u606F\uFF08\u627E\u4E0D\u5230\u8D44\u6E90\u65F6\uFF09
spring.messages.use-code-as-default-message=true